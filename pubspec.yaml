name: cadence
description: "Cadence — a timetable app with desktop and home-screen widgets, reminders and alarms."
publish_to: 'none'
homepage: https://github.com/ToshikSoni/TimeTable-Widget

version: 0.1.1+2

environment:
  sdk: ^3.13.5

dependencies:
  audioplayers: ^6.8.1
  dynamic_color: ^2.1.0
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  home_widget: ^0.10.0
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  timezone: ^0.11.2
  tray_manager: ^0.8.0
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  window_manager: ^0.5.2
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/icon-128.png
    - assets/branding/tray.png
    - assets/branding/tray.ico
    - assets/sounds/
    - assets/fonts/OFL.txt

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
