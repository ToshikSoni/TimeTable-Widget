name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please search [existing issues](https://github.com/ToshikSoni/TimeTable-Widget/issues) first to avoid duplicates.
        Security problems should be reported privately; see [SECURITY.md](https://github.com/ToshikSoni/TimeTable-Widget/blob/main/SECURITY.md).

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Windows
        - Linux
        - Android
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Cadence version
      description: Shown in Settings → About.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS version and install type
      description: For example "Windows 11 23H2, installer", "Ubuntu 24.04 GNOME, AppImage" or "Android 14, Pixel 7".
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Tap …
        3. See …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste any error output. When run from a terminal, Cadence prints errors to the console.
      render: text
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots and extra context
      description: |
        Drag images in here. If the bug depends on your timetable, a JSON backup helps a lot; remove anything personal first.
    validations:
      required: false
